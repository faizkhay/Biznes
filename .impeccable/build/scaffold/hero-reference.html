<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-b-perspective.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#0e328f}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:2688px">
  <div class="r-nav region chrome" data-region="nav"><!-- navigation bar: a darker cobalt band across the top holding the wordmark, two links and the Enquire pill --></div>
  <div class="r-logo region text" data-region="logo"><!-- wordmark biznes.mu in white sans with a small saffron shopfront glyph before it --><p style="font-size:var(--r-logo-font);line-height:1.05;margin:0">logo</p></div>
  <div class="r-nav-businesses region text" data-region="nav-businesses"><!-- navigation link reading Businesses in white --><p style="font-size:var(--r-nav-businesses-font);line-height:1.05;margin:0">nav-businesses</p></div>
  <div class="r-nav-how region text" data-region="nav-how"><!-- navigation link reading How it works in white --><p style="font-size:var(--r-nav-how-font);line-height:1.05;margin:0">nav-how</p></div>
  <div class="r-nav-enquire region control" data-region="nav-enquire"><!-- saffron yellow pill button with dark text reading Enquire: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-enquire); a control need not have button chrome --></div>
  <div class="r-headline region text" data-region="headline"><!-- headline BUY A BUSINESS READY TO OPEN in heavy condensed slanted capitals, white with a hard coral drop shade, two lines --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-lede region text" data-region="lede"><!-- four-line paragraph in white sans: In Mauritius, built by Khay Digital. The name, the brand, the domain, the website and the strategy are done. Each business is sold once, to one owner. --><p style="font-size:var(--r-lede-font);line-height:1.05;margin:0">lede</p></div>
  <div class="r-cta region control" data-region="cta"><!-- saffron yellow pill button with dark text reading See the businesses: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta); a control need not have button chrome --></div>
  <div class="r-how-link region text" data-region="how-link"><!-- white text link How it works with a small arrow and a thin underline --><p style="font-size:var(--r-how-link-font);line-height:1.05;margin:0">how-link</p></div>
  <figure class="r-sky region plate" data-region="sky"><img src="../../../assets/plates/sky.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-street region plate" data-region="street"><img src="../plates/street.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-next-peek region chrome" data-region="next-peek"><!-- saffron yellow band peeking in at the bottom edge: the top of the next section --></div>
</main>
</body>
</html>
